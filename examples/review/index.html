<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>machjs — schema review</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Onest:wght@200..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./src/style.css" />
    </head>
    <body data-phase="draft">
        <header class="bar">
            <span class="who">
                <a class="eyebrow" href="../">machjs</a>
                <h1>Schema review</h1>
            </span>
            <machjs-legend kind="states" class="tool"></machjs-legend>
            <div class="board tool" id="board"></div>
        </header>

        <!--
            The stage is the submission: the document on the left, the same document drawn on the
            right. Both are the inspector's — the editor reads the rule language and colours every
            state by its lane, the diagram is built from the same reading. Break a line and the
            drawing goes with it.

            Neither is marked `tool`: what stands here is the document under review, so it is
            drawn in the page's own colours. The instrument watching the review — the pipeline's
            diagram and its run — is in the dock, in the tool's.
        -->
        <main class="stage clears-dock">
            <div class="sheets" id="sheets">
                <!-- placed by the script -->
            </div>
            <section class="paper">
                <div class="paper-bar">
                    <h2 class="label">The submission</h2>
                    <span class="file" id="file">turnstile.rules</span>
                </div>
                <!-- The editor is built by the script: it needs its wiring before it
                     can draw, and naming the class is what registers the element. -->
                <div class="paper-body" id="paper"></div>
            </section>
            <section class="drawn">
                <h2 class="label">As it reads</h2>
                <div class="pane" id="drawn"></div>
                <p class="say" id="say" aria-live="polite"></p>
            </section>
        </main>

        <!-- The dock: the review pipeline itself — the machine this example is about. -->
        <aside class="dock tool">
            <div class="pane" id="flow"></div>
            <div class="pane"><machjs-history></machjs-history></div>
        </aside>

        <!--
            The review sheet, the notes and the feed. Not the shell's floating deck: on this page
            they are the application's own controls rather than a look at the machine, so they
            stand in a column of the stage. Each still takes a switch on the desk.
        -->
        <template id="panels">
            <section class="card sheet" id="sheet">
                <div class="sheet-bar">
                    <div class="stat">
                        <span class="label">Round</span>
                        <span class="value" id="round">—</span>
                    </div>
                    <div class="stat">
                        <span class="label">Sign-offs</span>
                        <span class="value" id="signs">—</span>
                    </div>
                </div>

                <!-- One row per member of the board: the name, what they have done, the act. -->
                <ul class="board-list" id="members">
                    <li data-who="anna">
                        <span class="name">anna</span>
                        <span class="mark"></span>
                        <button data-sign="anna">Sign</button>
                        <button data-ask="anna">Ask</button>
                    </li>
                    <li data-who="boris">
                        <span class="name">boris</span>
                        <span class="mark"></span>
                        <button data-sign="boris">Sign</button>
                        <button data-ask="boris">Ask</button>
                    </li>
                    <li data-who="vera">
                        <span class="name">vera</span>
                        <span class="mark"></span>
                        <button data-sign="vera">Sign</button>
                        <button data-ask="vera">Ask</button>
                    </li>
                </ul>

                <div class="ask">
                    <input
                        id="why"
                        type="text"
                        placeholder="what needs changing"
                        aria-label="Reason for requesting changes"
                    />
                </div>

                <div class="acts">
                    <button id="submit">Submit</button>
                    <button id="ship">Ship</button>
                    <button id="withdraw">Withdraw</button>
                </div>
            </section>

            <section class="card notes" id="notes">
                <ul class="faults" id="faults" aria-live="polite"></ul>
                <!-- What has been raised and answered. It stays for the life of the submission:
                     answered is not the same as never asked. -->
                <div class="settled" id="settled" hidden>
                    <h2 class="label">Settled</h2>
                    <ul id="closed"></ul>
                </div>
                <ul class="hint">
                    <li>
                        Press <b>Submit</b> — the text goes to the automatic
                        gate, and the pipeline below moves with it.
                    </li>
                    <li>Drop a <code>TO</code> — it will not read.</li>
                    <li>Add a state no rule leads to — the gate blocks it.</li>
                    <li>
                        Upper-case a state name — it passes, with a caution.
                    </li>
                </ul>
            </section>

            <section class="card trace" id="trace">
                <h2 class="label">Activity</h2>
                <ol id="feed" aria-live="polite"></ol>
            </section>
        </template>

        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
